<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هواشناسی ساده</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            padding:20px;
        }
        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border-radius: 50px;
            padding: 40px 35px;
            max-width: 480px;
            width:100%;
            border:1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            color:#fff;
            text-align:center;
        }
        h1 { font-size:32px; margin-bottom:25px; background: linear-gradient(90deg,#f7971e,#ffd200); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .search { display:flex; gap:12px; margin-bottom:25px; }
        .search input {
            flex:1; padding:16px 20px; border-radius:40px; border:none; outline:none;
            background:rgba(255,255,255,0.1); color:#fff; font-size:16px;
            border:1px solid rgba(255,255,255,0.1);
        }
        .search button {
            padding:16px 30px; border-radius:40px; border:none;
            background:linear-gradient(145deg,#f7971e,#ffd200);
            color:#1a1a2e; font-weight:700; font-size:16px; cursor:pointer;
        }
        .city { font-size:36px; font-weight:700; margin-bottom:5px; }
        .date { opacity:0.6; font-size:14px; margin-bottom:15px; }
        .temp { font-size:72px; font-weight:900; margin:10px 0; }
        .desc { font-size:22px; opacity:0.9; margin-bottom:20px; }
        .details { display:grid; grid-template-columns:1fr 1fr; gap:15px; }
        .detail { background:rgba(255,255,255,0.05); border-radius:20px; padding:15px; }
        .detail .label { font-size:13px; opacity:0.6; }
        .detail .value { font-size:22px; font-weight:700; }
        .error { color:#ff6b6b; background:rgba(255,0,0,0.1); padding:12px; border-radius:16px; margin-top:15px; display:none; }
        .error.show { display:block; }
        .loc-btn { width:100%; padding:14px; border-radius:40px; border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.05); color:#fff; font-size:16px; cursor:pointer; margin-bottom:20px; }
        .loc-btn:hover { background:rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <div class="card">
        <h1>🌤 هواشناسی</h1>
        <div class="search">
            <input type="text" id="cityInput" placeholder="نام شهر...">
            <button id="searchBtn">جستجو</button>
        </div>
        <button class="loc-btn" id="locationBtn">📍 موقعیت من</button>
        <div id="weather">
            <div class="city" id="cityName">تهران</div>
            <div class="date" id="dateTime">--</div>
            <div id="icon"><img src="https://openweathermap.org/img/wn/10d@4x.png" width="100"></div>
            <div class="temp" id="temp">-- °C</div>
            <div class="desc" id="desc">--</div>
            <div class="details">
                <div class="detail"><span class="label">💧 رطوبت</span><span class="value" id="humidity">--%</span></div>
                <div class="detail"><span class="label">💨 باد</span><span class="value" id="wind">-- km/h</span></div>
            </div>
        </div>
        <div class="error" id="errorMsg">خطا</div>
    </div>

    <script>
        const API_KEY = 'YOUR_API_KEY';
        const BASE = 'https://api.openweathermap.org/data/2.5/weather';

        const cityInput = document.getElementById('cityInput');
        const searchBtn = document.getElementById('searchBtn');
        const locationBtn = document.getElementById('locationBtn');
        const errorMsg = document.getElementById('errorMsg');
        const cityName = document.getElementById('cityName');
        const dateTime = document.getElementById('dateTime');
        const icon = document.getElementById('icon');
        const temp = document.getElementById('temp');
        const desc = document.getElementById('desc');
        const humidity = document.getElementById('humidity');
        const wind = document.getElementById('wind');

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.classList.add('show');
            setTimeout(() => errorMsg.classList.remove('show'), 5000);
        }

        function KtoC(k) { return Math.round(k - 273.15); }

        async function fetchWeather(query) {
            try {
                let url;
                if (typeof query === 'string') url = `${BASE}?q=${encodeURIComponent(query)}&appid=${API_KEY}`;
                else if (query.lat && query.lon) url = `${BASE}?lat=${query.lat}&lon=${query.lon}&appid=${API_KEY}`;
                else throw new Error('Invalid');
                const res = await fetch(url);
                if (!res.ok) throw new Error('شهر پیدا نشد');
                const data = await res.json();
                cityName.textContent = data.name;
                const d = new Date((data.dt + data.timezone) * 1000);
                dateTime.textContent = d.toLocaleString('fa-IR', { day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit' });
                icon.innerHTML = `<img src="https://openweathermap.org/img/wn/${data.weather[0].icon}@4x.png" width="100">`;
                temp.textContent = `${KtoC(data.main.temp)} °C`;
                desc.textContent = data.weather[0].description;
                humidity.textContent = `${data.main.humidity}%`;
                wind.textContent = `${Math.round(data.wind.speed * 3.6)} km/h`;
                errorMsg.classList.remove('show');
            } catch(err) {
                showError(err.message);
            }
        }

        searchBtn.addEventListener('click', () => {
            const city = cityInput.value.trim();
            if (city) fetchWeather(city);
            else showError('نام شهر رو وارد کن');
        });
        cityInput.addEventListener('keyup', e => { if(e.key === 'Enter') searchBtn.click(); });
        locationBtn.addEventListener('click', () => {
            if(!navigator.geolocation) return showError('موقعیت‌یابی نداره');
            navigator.geolocation.getCurrentPosition(
                pos => fetchWeather({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
                () => showError('دسترسی رد شد')
            );
        });
        fetchWeather('Tehran');
    </script>
</body>
</html>
